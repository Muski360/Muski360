<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-labelledby="title description">
  <title id="title">Muski360 terminal introduction</title>
  <desc id="description">A terminal types a git push command followed by Everything up-to-date. Somehow.</desc>

  <!-- EDIT COLORS: terminal text, output text, and accent. -->
  <style>
    .text { fill: #f0f6fc; font: 22px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .output { fill: #8b949e; }
    .prompt { fill: #3fb950; font-weight: 700; }
    .rule { stroke: #30363d; }
    .cursor { fill: #3fb950; }
    .static-copy { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .animated-copy { display: none; }
      .static-copy { display: inline; }
      .cursor { display: none; }
    }
  </style>

  <defs>
    <clipPath id="line-1">
      <rect x="20" y="30" width="0" height="32">
        <animate attributeName="width" values="0;13;26;39;52;65;78;91;104;117;130;143;156;169;182;195;208;221;234;247;260;273;286;299;312;325;338;351;364;377;390;403;416;429;442;455;468;481;494;507" calcMode="discrete" dur="2.5s" begin="0.35s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="line-2">
      <rect x="20" y="78" width="0" height="32">
        <animate attributeName="width" values="0;13;26;39;52;65;78;91;104;117;130;143;156;169;182;195;208;221;234;247;260;273;286;299;312;325;338;351;364;377;390;403" calcMode="discrete" dur="2s" begin="3.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- EDIT TEXT: adjust the clip widths above if the character counts change. -->
  <g class="text animated-copy">
    <text x="20" y="55" clip-path="url(#line-1)"><tspan class="prompt">muski360@github:~$</tspan><tspan> git push origin main</tspan></text>
    <text x="20" y="103" class="output" clip-path="url(#line-2)">Everything up-to-date. Somehow.</text>
  </g>

  <g class="text static-copy">
    <text x="20" y="55"><tspan class="prompt">muski360@github:~$</tspan><tspan> git push origin main</tspan></text>
    <text x="20" y="103" class="output">Everything up-to-date. Somehow.</text>
  </g>

  <line class="rule" x1="20" y1="128" x2="880" y2="128"/>
  <rect class="cursor" x="427" y="82" width="3" height="24" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.01s" begin="5.25s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" calcMode="discrete" dur="0.9s" begin="5.26s" repeatCount="indefinite"/>
  </rect>
</svg>
