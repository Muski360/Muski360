name: Generate profile activity graphics

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 03:15 UTC. Change this cron to adjust the update time.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate light and dark SVGs
        # Pinned from abozanona/pacman-contribution-graph main on 2026-09-01.
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          player_style: opportunistic # opportunistic | conservative | aggressive
          hide_month_labels: "true"

      - name: Generate light activity graph
        # Pinned from maurodesouza/github-readme-activity-graph-action main on 2026-09-01.
        uses: maurodesouza/github-readme-activity-graph-action@9b38b03cac7ffb9f093a82f0ea9c634d5df62297
        with:
          username: ${{ github.repository_owner }}
          options: "bg_color=ffffff&color=24292f&line=1f883d&point=0969da&area=true&hide_border=true&custom_title=Atividade%20recente"
          output_path: dist/activity-graph-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark activity graph
        uses: maurodesouza/github-readme-activity-graph-action@9b38b03cac7ffb9f093a82f0ea9c634d5df62297
        with:
          username: ${{ github.repository_owner }}
          options: "bg_color=0d1117&color=c9d1d9&line=3fb950&point=58a6ff&area=true&hide_border=true&custom_title=Atividade%20recente"
          output_path: dist/activity-graph-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        # crazy-max/ghaction-github-pages v4.2.0, pinned for reproducible builds.
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
